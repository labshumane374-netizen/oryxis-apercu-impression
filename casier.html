<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Weazel News — Éditeur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ecran">

    <!-- ============================ bandeau ============================ -->
    <header class="bandeau cache" id="bandeau">
      <div class="marque">
        <div class="mot">WEAZEL <i>NEWS</i></div>
        <div class="trait"></div>
        <div class="devise">Informer<br>aujourd'hui.<br>Pour demain.</div>
      </div>
      <div class="coin">
        <div class="role" id="uiRole">Éditeur de journal</div>
        <div>
          <div class="heure" id="horlogeHeure">00:00</div>
          <div class="jour" id="horlogeJour"></div>
        </div>
      </div>
    </header>

    <div class="corps">

      <!-- ========================= rail gauche ========================= -->
      <aside class="carte cache" id="railGauche">
        <header>
          <div class="vig" id="vigGauche"></div>
          <div style="flex:1">
            <h2 id="uiElementsL">Éléments</h2>
            <p id="uiElementsP"></p>
          </div>
          <div class="outils-haut">
            <button type="button" id="btnUndo"></button>
            <button type="button" id="btnRedo"></button>
          </div>
        </header>

        <div class="defile">
          <div class="sect">
            <div class="outils" id="outils"></div>
          </div>

          <div class="sect">
            <h3 class="titre-sect" id="uiPagesL">Pages</h3>
            <div class="bande" id="bandePages"></div>
            <div class="grille" style="grid-template-columns:1fr 1fr">
              <button class="plat" id="btnDupPage" type="button"></button>
              <button class="plat danger" id="btnSupprPage" type="button"></button>
            </div>
          </div>

          <div class="sect">
            <h3 class="titre-sect" id="uiModeleL">Modèles de page</h3>
            <div id="listeModeles"></div>
          </div>
        </div>

        <div class="signature-carte">
          <span>Weazel News Editor</span>
          <span><span class="point">●</span> <span id="compteModeles"></span></span>
        </div>
      </aside>

      <!-- =========================== la page =========================== -->
      <main class="scene cache" id="scene">
        <div class="cadre" id="cadre">
          <div class="page" id="page"></div>
        </div>
      </main>

      <!-- ========================= rail droit ========================== -->
      <aside class="carte cache" id="railDroite">
        <header>
          <div class="vig" id="vigDroite"></div>
          <div>
            <h2 id="uiPanneauL">Page</h2>
            <p id="uiPanneauP"></p>
          </div>
        </header>

        <div class="defile" id="inspecteur"></div>

        <div class="pied">
          <div class="stock" id="stock"></div>
          <div class="ligne-quantite">
            <span class="etiq" id="uiQuantiteL">Exemplaires</span>
            <div class="compteur">
              <button type="button" id="moins">−</button>
              <input type="number" id="quantite" value="1" min="1" max="100">
              <button type="button" id="plus">+</button>
            </div>
          </div>
          <button class="principal" id="btnImprimer" type="button"></button>
          <button class="second" id="btnApercu" type="button"></button>
          <button class="second cache" id="btnLien" type="button"></button>
          <div class="duo-archives">
            <button class="second" id="btnBrouillons" type="button"></button>
            <button class="second" id="btnArchives" type="button"></button>
            <button class="second" id="btnArchiver" type="button"></button>
          </div>
          <button class="second" id="btnAnnuler" type="button"></button>
        </div>

        <div class="signature-carte">
          <span class="ls">Los Santos</span>
          <span class="droite" id="sauvegarde">Sauvegardé</span>
        </div>
      </aside>

    </div>

    <!-- ============================ lecteur =========================== -->
    <section id="lecteur" class="cache">
      <div class="colonne-lecture">
        <div class="cadre" id="cadreLecture">
          <div class="page" id="pageLecture"></div>
        </div>
        <div class="barre-pages cache" id="barrePages">
          <button type="button" id="pagePrec" aria-label="Page précédente">‹</button>
          <span id="pageCompte">1 / 1</span>
          <button type="button" id="pageSuiv" aria-label="Page suivante">›</button>
          <em id="uiTourner"></em>
        </div>
        <div class="signature-lecture" id="signatureLecture"></div>
      </div>
      <div class="actions-lecture">
        <button class="second cache" id="btnImprimerLecture" type="button"></button>
        <button class="second" id="btnFermerLecture" type="button"></button>
      </div>
    </section>

  </div>

  <div id="menuContexte" class="cache"></div>

  <div id="modale" class="cache">
    <div id="modaleFond"></div>
    <div id="modaleBoite"></div>
  </div>

  <div id="notif" class="cache"></div>

  <script src="js/icones.js"></script>
  <script src="js/etat.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/elements.js"></script>
  <script src="js/panneaux.js"></script>
  <script src="js/modales.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
